name: Ghost Screenshots
on:
  push:
  workflow_dispatch:
jobs:
  shots:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: What this commit is (app, static site, or no page yet)
        run: |
          kind=docs
          if [ -f package.json ] || ls supabase/migrations/*.sql migrations/*.sql db/migrations/*.sql 2>/dev/null | grep -q .; then kind=app
          elif find . -maxdepth 5 \( -name .git -o -name node_modules -o -name .github -o -name ghost-screenshots \) -prune -o -type f \( -iname '*.html' -o -iname '*.htm' -o -iname '*.js' -o -iname '*.mjs' -o -iname '*.cjs' -o -iname '*.jsx' -o -iname '*.ts' -o -iname '*.tsx' -o -iname '*.css' -o -iname '*.scss' -o -iname '*.vue' -o -iname '*.svelte' -o -iname '*.astro' -o -iname '*.php' -o -iname '*.py' -o -iname '*.rb' -o -iname '*.go' \) -print | head -1 | grep -q .; then kind=static
          fi
          if [ "$kind" = static ]; then
            for f in server.js server.mjs server.ts app.js index.js src/server.js src/server.ts src/index.js src/app.js; do
              if grep -qs '[.]listen(' "$f"; then kind=app; fi
            done
          fi
          echo "GHOST_KIND=$kind" >> "$GITHUB_ENV"
          case "$kind" in
            app) echo "What this commit is: an app (package.json, database changes or a server): the full check runs." ;;
            static) echo "What this commit is: a static site (pages, no package.json, no server): no database, install or build; the folder is served and photographed." ;;
            *) echo "What this commit is: no page or app yet (only documents): nothing to photograph." ;;
          esac
      - name: Start a database (only when the app uses Postgres)
        if: env.GHOST_KIND == 'app'
        run: |
          if { [ -f package.json ] && grep -qE '"(pg|postgres|@prisma/client|prisma|drizzle-orm|knex|sequelize|typeorm|@neondatabase/serverless|@vercel/postgres|@supabase/supabase-js)"' package.json; } || ls supabase/migrations/*.sql migrations/*.sql db/migrations/*.sql 2>/dev/null | grep -q .; then
            docker run -d --name ghost-db -e POSTGRES_PASSWORD=ghost -e POSTGRES_DB=app -p 5432:5432 postgres:17-alpine >/dev/null
            for i in $(seq 1 40); do docker exec ghost-db pg_isready -U postgres -d app >/dev/null 2>&1 && break; sleep 1; done
            echo "DATABASE_URL=postgresql://postgres:ghost@127.0.0.1:5432/app" >> "$GITHUB_ENV"
            echo "Postgres is ready: DATABASE_URL is set for the build and the app's server."
          fi
      - name: Install the database changes in an empty database
        if: env.GHOST_KIND == 'app'
        run: |
          PSQL="${PSQL:-docker exec -i ghost-db psql -q -U postgres -d app -v ON_ERROR_STOP=1}"
          files=""
          for d in supabase/migrations migrations db/migrations; do
            if ls "$d"/*.sql >/dev/null 2>&1; then files="$(ls "$d"/*.sql | sort)"; break; fi
          done
          if [ -z "$files" ] || [ -z "${DATABASE_URL:-}${PSQL_SET:-}" ]; then echo "No .sql database changes to install."; exit 0; fi
          # Supabase records each change by the number before its first underscore: two files with the same number
          # clash when deployed (a Phase 2 build added 0003_ai.sql next to 0003_claim_due.sql).
          if [ "$d" = "supabase/migrations" ]; then
            dup="$(for f in $files; do b="$(basename "$f")"; echo "${b%%_*}"; done | sort | uniq -d | head -1)"
            if [ -n "$dup" ]; then
              same="$(for f in $files; do b="$(basename "$f")"; [ "${b%%_*}" = "$dup" ] && printf '%s ' "$b"; done)"
              echo "FAIL: two database change files share the number $dup ($same). Supabase records each change by that number, so they clash when deployed: give the new file the next free number."
              echo "::error::database change files share the number $dup: $same"
              exit 1
            fi
          fi
          if [ "$d" = "supabase/migrations" ]; then
            $PSQL <<'GHOST_AUTH' >/dev/null
          create schema if not exists auth;
          create table if not exists auth.users (id uuid primary key, email text, raw_user_meta_data jsonb, created_at timestamptz default now());
          create or replace function auth.uid() returns uuid language sql stable as $f$ select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $f$;
          create or replace function auth.role() returns text language sql stable as $f$ select nullif(current_setting('request.jwt.claim.role', true), '') $f$;
          create or replace function auth.jwt() returns jsonb language sql stable as $f$ select coalesce(nullif(current_setting('request.jwt.claims', true), ''), '{}')::jsonb $f$;
          do $r$ begin create role anon nologin; exception when duplicate_object then null; end $r$;
          do $r$ begin create role authenticated nologin; exception when duplicate_object then null; end $r$;
          do $r$ begin create role service_role nologin bypassrls; exception when duplicate_object then null; end $r$;
          GHOST_AUTH
          fi
          $PSQL <<'GHOST_SEED' >/dev/null
          create schema if not exists ghost_ci;
          create or replace function ghost_ci.seed() returns text language plpgsql as $s$
          declare t record; c record; cols text; vals text; v text; chk text; added int := 0; pass int; total int := 0; filled int := 0; empty text := '';
          begin
            for pass in 1..3 loop
              for t in select n.nspname as sch, k.relname as tbl from pg_class k join pg_namespace n on n.oid = k.relnamespace
                       where k.relkind = 'r' and n.nspname in ('public', 'auth') loop
                execute format('select 1 from %I.%I limit 1', t.sch, t.tbl) into v;
                continue when v is not null;
                cols := ''; vals := '';
                for c in select a.attname as col, a.attnum as num, format_type(a.atttypid, a.atttypmod) as typ, a.atttypid as tid,
                           (select format('%I.%I', fn.nspname, fc.relname) || '|' || fa.attname
                              from pg_constraint fk join pg_class fc on fc.oid = fk.confrelid join pg_namespace fn on fn.oid = fc.relnamespace
                              join pg_attribute fa on fa.attrelid = fk.confrelid and fa.attnum = fk.confkey[1]
                             where fk.conrelid = a.attrelid and fk.contype = 'f' and fk.conkey[1] = a.attnum limit 1) as ref
                         from pg_attribute a
                        where a.attrelid = format('%I.%I', t.sch, t.tbl)::regclass and a.attnum > 0 and not a.attisdropped
                          and a.attnotnull and not a.atthasdef and a.attidentity = '' and a.attgenerated = '' loop
                  -- The table's own rules for this column: a list of allowed values, or a lowest number.
                  select string_agg(pg_get_constraintdef(k.oid), ' ') into chk from pg_constraint k
                   where k.conrelid = format('%I.%I', t.sch, t.tbl)::regclass and k.contype = 'c' and c.num = any(k.conkey);
                  if c.ref is not null then
                    v := format('(select %I from %s limit 1)', split_part(c.ref, '|', 2), split_part(c.ref, '|', 1));
                  elsif exists (select 1 from pg_enum where enumtypid = c.tid) then
                    v := quote_literal((select enumlabel from pg_enum where enumtypid = c.tid order by enumsortorder limit 1)) || '::' || c.typ;
                  elsif chk ~ '''' and (c.typ in ('text', 'character varying') or c.typ like 'character%') then
                    v := quote_literal(substring(chk from '''([^'']*)'''));
                  elsif chk ~ '>=? *[(]?-?[0-9]' and (c.typ in ('integer', 'bigint', 'smallint', 'real', 'double precision') or c.typ like 'numeric%') then
                    v := substring(chk from '>=? *[(]?(-?[0-9]+)');
                  elsif c.typ like '%[]' then v := '''{}''';
                  elsif c.typ = 'uuid' then v := 'gen_random_uuid()';
                  elsif c.typ in ('integer', 'bigint', 'smallint', 'numeric', 'real', 'double precision') or c.typ like 'numeric(%' then v := '1';
                  elsif c.typ = 'boolean' then v := 'false';
                  elsif c.typ like 'timestamp%' then v := 'now()';
                  elsif c.typ = 'date' then v := 'current_date';
                  elsif c.typ like 'time%' then v := '''12:00''';
                  elsif c.typ = 'interval' then v := '''1 hour''';
                  elsif c.typ in ('inet', 'cidr') then v := '''127.0.0.1''';
                  elsif c.typ = 'bytea' then v := 'decode(''00'', ''hex'')';
                  elsif c.typ in ('json', 'jsonb') then v := '''{}''';
                  else v := quote_literal('ghost-seed');
                  end if;
                  cols := cols || case when cols = '' then '' else ', ' end || quote_ident(c.col);
                  vals := vals || case when vals = '' then '' else ', ' end || v || '::' || c.typ;
                end loop;
                begin
                  if cols = '' then execute format('insert into %I.%I default values', t.sch, t.tbl);
                  else execute format('insert into %I.%I (%s) values (%s)', t.sch, t.tbl, cols, vals); end if;
                  added := added + 1;
                exception when others then null; -- a table it can't fill (a check rule it can't guess): skipped
                end;
              end loop;
            end loop;
            -- What it could and couldn't fill, said out loud: a table it skipped is often the one with the strict rule.
            for t in select n.nspname as sch, k.relname as tbl from pg_class k join pg_namespace n on n.oid = k.relnamespace
                     where k.relkind = 'r' and n.nspname = 'public' order by 2 loop
              total := total + 1;
              execute format('select 1 from %I.%I limit 1', t.sch, t.tbl) into v;
              if v is not null then filled := filled + 1; else empty := empty || case when empty = '' then '' else ', ' end || t.tbl; end if;
            end loop;
            return filled || '|' || total || '|' || empty;
          end $s$;
          GHOST_SEED
          n=0
          for f in $files; do
            # From the second file on, every table has a row first (a change that breaks on existing rows fails here).
            if [ $n -gt 0 ]; then
              # Seeding is the check's own step: its failures say SEED FAILED, never "the database change doesn't install".
              if ! seeded="$(echo "select ghost_ci.seed();" | $PSQL -tA 2>&1)"; then
                echo "SEED FAILED: the check's own seeding step crashed before $f (Ghost Code's check, not your database change): $(printf '%s' "$seeded" | grep -m1 ERROR)"
                exit 1
              fi
              seeded="$(printf '%s' "$seeded" | tail -1)"
              filled="${seeded%%|*}"; rest="${seeded#*|}"; total="${rest%%|*}"; skipped="${rest#*|}"
              if [ -n "$total" ] && [ "$total" -gt 0 ] && [ "$filled" = "0" ]; then
                echo "SEED FAILED: couldn't put a made-up row in any of the $total tables before $f (their rules or links are too strict to guess), so $f can't be checked against existing rows. This is the seeding, not a broken database change; a schema it can't fill must not read like a clean install. Tables: $skipped"
                exit 1
              fi
              [ -n "$total" ] && echo "Before $f: rows in $filled of $total tables${skipped:+, skipped (could not fill): $skipped}"
            fi
            if ! out="$($PSQL < "$f" 2>&1)"; then
              msg="$(printf '%s' "$out" | grep -m1 -E 'ERROR' || printf '%s' "$out" | head -1)"
              where="an empty database"; [ $n -gt 0 ] && where="a database that already has rows (one made-up row per table)"
              echo "FAIL: the database change $f doesn't install in $where: $msg"
              echo "::error file=$f::doesn't install: $msg"
              exit 1
            fi
            n=$((n+1))
          done
          # Every database function, called once with empty input and undone (the check's own failure says CHECK FAILED).
          fnres="$($PSQL -tA 2>&1 <<'GHOST_FN'
          set statement_timeout = '5s';
          create schema if not exists ghost_ci;
          create table if not exists ghost_ci.fn_check (fn text, problem text);
          truncate ghost_ci.fn_check;
          do $chk$
          declare f record; argl text; total int := 0;
          begin
            for f in select p.proname as fname, ns.nspname as sch, p.proargtypes::oid[] as types
                       from pg_proc p join pg_namespace ns on ns.oid = p.pronamespace join pg_language l on l.oid = p.prolang
                      where ns.nspname = 'public' and p.prokind = 'f' and l.lanname in ('plpgsql', 'sql')
                        and p.prorettype not in ('trigger'::regtype, 'event_trigger'::regtype) loop
              select string_agg('NULL::' || format_type(t, null), ', ' order by i) into argl from unnest(f.types) with ordinality as a(t, i);
              total := total + 1;
              begin
                execute format('select %I.%I(%s)', f.sch, f.fname, coalesce(argl, ''));
                raise exception using errcode = 'GH000'; -- always undo what the call did
              exception when others then
                -- Refusing empty input (its own error, a missing row, a rule) is fine. A code error is not:
                -- class 42 = an unknown or ambiguous column, a missing table or function, a type mismatch.
                if sqlstate like '42%' then insert into ghost_ci.fn_check values (f.fname, sqlerrm); end if;
              end;
            end loop;
            insert into ghost_ci.fn_check values ('__total__', total::text);
          end $chk$;
          select fn || '|' || problem from ghost_ci.fn_check order by fn = '__total__' desc, fn;
          GHOST_FN
          )"
          fntotal="$(printf '%s
          ' "$fnres" | grep '^__total__|' | cut -d'|' -f2)"
          if [ -z "$fntotal" ]; then
            echo "CHECK FAILED: the check's own database-function test didn't run (Ghost Code's check, not your app): $(printf '%s' "$fnres" | grep -m1 ERROR)"
            exit 1
          fi
          fnbad="$(printf '%s
          ' "$fnres" | grep '|' | grep -v '^__total__|')"
          if [ -n "$fnbad" ]; then
            printf '%s
          ' "$fnbad" | while IFS='|' read -r fname problem; do
              echo "FAIL: the database function $fname is broken: $problem. Installing it didn't show this; calling it does (called once with empty input, then undone)."
              echo "::error::database function $fname: $problem"
            done
            exit 1
          fi
          echo "Installed $n database change file(s), each one on top of the earlier ones${total:+; rows in $filled of $total tables before the last one${skipped:+ (skipped: $skipped)}}; called $fntotal database function(s) once with empty input, undone: ok"
      - name: Upgrade a database like the live one (the main branch's changes, then this commit's new ones)
        if: env.GHOST_KIND == 'app'
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "Upgrade check: no database in this app."; exit 0; fi
          # What is already live: the main branch (on the main branch itself, the commit before this push).
          main="${{ github.event.repository.default_branch }}"; before="${{ github.event.before }}"
          old="$main"; [ "$GITHUB_REF_NAME" = "$main" ] && old="$before"
          export BASE_DIR="$RUNNER_TEMP/ghost-base"; mkdir -p "$BASE_DIR"
          if [ -n "$old" ] && [ "$old" != "0000000000000000000000000000000000000000" ] && git fetch -q --depth=1 origin "$old" 2>/dev/null; then
            for x in supabase/migrations migrations db/migrations; do git archive FETCH_HEAD "$x" 2>/dev/null | tar -x -C "$BASE_DIR" 2>/dev/null || true; done
          fi
          docker exec ghost-db psql -q -U postgres -c "create database ghost_up" >/dev/null
          export PSQL_UP="docker exec -i ghost-db psql -q -U postgres -d ghost_up -v ON_ERROR_STOP=1"
          d=""
          for x in supabase/migrations migrations db/migrations; do
            if ls "$x"/*.sql >/dev/null 2>&1; then d="$x"; break; fi
          done
          if [ -z "$d" ] || [ -z "${PSQL_UP:-}" ]; then echo "Upgrade check: no .sql database changes to install."; exit 0; fi
          base="${BASE_DIR:-/nonexistent}/$d"
          if ! ls "$base"/*.sql >/dev/null 2>&1; then
            echo "Upgrade check: the main branch has no database changes yet, so there is no older database to upgrade. Nothing was checked here (the first-install check above is the one that counts)."
            exit 0
          fi
          bad=0
          for b in $(ls "$base"/*.sql | sort); do
            name="$(basename "$b")"
            if [ ! -f "$d/$name" ]; then
              echo "FAIL: $d/$name is on the main branch and this change deletes it. A database that already installed it still has what it made; the files no longer say so. Keep the file, and undo what it did in a new file."
              echo "::error::$d/$name was deleted but is already installed on live databases"
              bad=1
            elif ! cmp -s "$b" "$d/$name"; then
              echo "FAIL: $d/$name is already on the main branch and this change edits it. A database that already installed it will never get the edit (each file is installed once), so the live database and a new one end up different. Leave it as it is on main and put the change in a new file with the next number."
              echo "::error file=$d/$name::edited after it was installed: put the change in a new file"
              bad=1
            fi
          done
          last="$(ls "$base"/*.sql | sort | tail -1 | xargs basename)"
          new=""
          for f in $(ls "$d"/*.sql | sort); do
            name="$(basename "$f")"
            [ -f "$base/$name" ] && continue
            if [ "$(printf '%s\n%s\n' "$name" "$last" | sort | head -1)" = "$name" ]; then
              echo "FAIL: the new file $d/$name comes before $last, which is already on the main branch. A new database runs it first; a live one already has $last and runs it after (or not at all). Give it a number after $last."
              echo "::error file=$d/$name::numbered before $last, which is already installed"
              bad=1
            fi
            new="$new $f"
          done
          [ $bad -eq 1 ] && exit 1
          if [ -z "$new" ]; then echo "Upgrade check: no new database change files in this commit."; exit 0; fi
          if [ "$d" = "supabase/migrations" ]; then
            $PSQL_UP <<'GHOST_AUTH' >/dev/null
          create schema if not exists auth;
          create table if not exists auth.users (id uuid primary key, email text, raw_user_meta_data jsonb, created_at timestamptz default now());
          create or replace function auth.uid() returns uuid language sql stable as $f$ select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $f$;
          create or replace function auth.role() returns text language sql stable as $f$ select nullif(current_setting('request.jwt.claim.role', true), '') $f$;
          create or replace function auth.jwt() returns jsonb language sql stable as $f$ select coalesce(nullif(current_setting('request.jwt.claims', true), ''), '{}')::jsonb $f$;
          do $r$ begin create role anon nologin; exception when duplicate_object then null; end $r$;
          do $r$ begin create role authenticated nologin; exception when duplicate_object then null; end $r$;
          do $r$ begin create role service_role nologin bypassrls; exception when duplicate_object then null; end $r$;
          GHOST_AUTH
          fi
          m=0
          for b in $(ls "$base"/*.sql | sort); do
            if ! out="$($PSQL_UP < "$b" 2>&1)"; then
              echo "UPGRADE CHECK COULD NOT RUN: the main branch's own file $d/$(basename "$b") doesn't install, so there is no older database to upgrade: $(printf '%s' "$out" | grep -m1 -E 'ERROR' || printf '%s' "$out" | head -1). Nothing about this commit's changes was checked here."
              exit 1
            fi
            m=$((m+1))
          done
          $PSQL_UP <<'GHOST_SEED' >/dev/null
          create schema if not exists ghost_ci;
          create or replace function ghost_ci.seed() returns text language plpgsql as $s$
          declare t record; c record; cols text; vals text; v text; chk text; added int := 0; pass int; total int := 0; filled int := 0; empty text := '';
          begin
            for pass in 1..3 loop
              for t in select n.nspname as sch, k.relname as tbl from pg_class k join pg_namespace n on n.oid = k.relnamespace
                       where k.relkind = 'r' and n.nspname in ('public', 'auth') loop
                execute format('select 1 from %I.%I limit 1', t.sch, t.tbl) into v;
                continue when v is not null;
                cols := ''; vals := '';
                for c in select a.attname as col, a.attnum as num, format_type(a.atttypid, a.atttypmod) as typ, a.atttypid as tid,
                           (select format('%I.%I', fn.nspname, fc.relname) || '|' || fa.attname
                              from pg_constraint fk join pg_class fc on fc.oid = fk.confrelid join pg_namespace fn on fn.oid = fc.relnamespace
                              join pg_attribute fa on fa.attrelid = fk.confrelid and fa.attnum = fk.confkey[1]
                             where fk.conrelid = a.attrelid and fk.contype = 'f' and fk.conkey[1] = a.attnum limit 1) as ref
                         from pg_attribute a
                        where a.attrelid = format('%I.%I', t.sch, t.tbl)::regclass and a.attnum > 0 and not a.attisdropped
                          and a.attnotnull and not a.atthasdef and a.attidentity = '' and a.attgenerated = '' loop
                  -- The table's own rules for this column: a list of allowed values, or a lowest number.
                  select string_agg(pg_get_constraintdef(k.oid), ' ') into chk from pg_constraint k
                   where k.conrelid = format('%I.%I', t.sch, t.tbl)::regclass and k.contype = 'c' and c.num = any(k.conkey);
                  if c.ref is not null then
                    v := format('(select %I from %s limit 1)', split_part(c.ref, '|', 2), split_part(c.ref, '|', 1));
                  elsif exists (select 1 from pg_enum where enumtypid = c.tid) then
                    v := quote_literal((select enumlabel from pg_enum where enumtypid = c.tid order by enumsortorder limit 1)) || '::' || c.typ;
                  elsif chk ~ '''' and (c.typ in ('text', 'character varying') or c.typ like 'character%') then
                    v := quote_literal(substring(chk from '''([^'']*)'''));
                  elsif chk ~ '>=? *[(]?-?[0-9]' and (c.typ in ('integer', 'bigint', 'smallint', 'real', 'double precision') or c.typ like 'numeric%') then
                    v := substring(chk from '>=? *[(]?(-?[0-9]+)');
                  elsif c.typ like '%[]' then v := '''{}''';
                  elsif c.typ = 'uuid' then v := 'gen_random_uuid()';
                  elsif c.typ in ('integer', 'bigint', 'smallint', 'numeric', 'real', 'double precision') or c.typ like 'numeric(%' then v := '1';
                  elsif c.typ = 'boolean' then v := 'false';
                  elsif c.typ like 'timestamp%' then v := 'now()';
                  elsif c.typ = 'date' then v := 'current_date';
                  elsif c.typ like 'time%' then v := '''12:00''';
                  elsif c.typ = 'interval' then v := '''1 hour''';
                  elsif c.typ in ('inet', 'cidr') then v := '''127.0.0.1''';
                  elsif c.typ = 'bytea' then v := 'decode(''00'', ''hex'')';
                  elsif c.typ in ('json', 'jsonb') then v := '''{}''';
                  else v := quote_literal('ghost-seed');
                  end if;
                  cols := cols || case when cols = '' then '' else ', ' end || quote_ident(c.col);
                  vals := vals || case when vals = '' then '' else ', ' end || v || '::' || c.typ;
                end loop;
                begin
                  if cols = '' then execute format('insert into %I.%I default values', t.sch, t.tbl);
                  else execute format('insert into %I.%I (%s) values (%s)', t.sch, t.tbl, cols, vals); end if;
                  added := added + 1;
                exception when others then null; -- a table it can't fill (a check rule it can't guess): skipped
                end;
              end loop;
            end loop;
            -- What it could and couldn't fill, said out loud: a table it skipped is often the one with the strict rule.
            for t in select n.nspname as sch, k.relname as tbl from pg_class k join pg_namespace n on n.oid = k.relnamespace
                     where k.relkind = 'r' and n.nspname = 'public' order by 2 loop
              total := total + 1;
              execute format('select 1 from %I.%I limit 1', t.sch, t.tbl) into v;
              if v is not null then filled := filled + 1; else empty := empty || case when empty = '' then '' else ', ' end || t.tbl; end if;
            end loop;
            return filled || '|' || total || '|' || empty;
          end $s$;
          GHOST_SEED
          if ! seeded="$(echo "select ghost_ci.seed();" | $PSQL_UP -tA 2>&1)"; then
            echo "SEED FAILED: the upgrade check's own seeding step crashed (Ghost Code's check, not your database change): $(printf '%s' "$seeded" | grep -m1 ERROR)"
            exit 1
          fi
          seeded="$(printf '%s' "$seeded" | tail -1)"
          filled="${seeded%%|*}"; rest="${seeded#*|}"; total="${rest%%|*}"; skipped="${rest#*|}"
          n=0
          for f in $new; do
            if ! out="$($PSQL_UP < "$f" 2>&1)"; then
              msg="$(printf '%s' "$out" | grep -m1 -E 'ERROR' || printf '%s' "$out" | head -1)"
              echo "FAIL: the database change $f doesn't install on a database like the live one (the $m file(s) already on the main branch, with rows in $filled of $total tables): $msg"
              echo "::error file=$f::doesn't install on top of what is already live: $msg"
              exit 1
            fi
            n=$((n+1))
          done
          echo "Upgrade check passed: $n new database change file(s) installed on top of the $m already on the main branch, with rows in $filled of $total tables${skipped:+ (could not fill: $skipped)}."

      - name: Install and build the app
        if: env.GHOST_KIND == 'app'
        run: |
          echo "GHOST_BUILD_START=$(date +%s)" >> "$GITHUB_ENV"
          if [ -f package.json ]; then
            if [ -f pnpm-lock.yaml ]; then npm i -g pnpm && pnpm install --frozen-lockfile
            elif [ -f yarn.lock ]; then yarn install --frozen-lockfile
            elif [ -f package-lock.json ]; then npm ci
            else npm install; fi
            if [ -n "$DATABASE_URL" ]; then
              if [ -f prisma/schema.prisma ]; then
                if [ -d prisma/migrations ]; then npx prisma migrate deploy; else npx prisma db push --skip-generate; fi
              fi
              for s in db:migrate migrate; do if npm run | grep -qE "^  $s$"; then npm run $s; break; fi; done
            fi
            if npm run | grep -qE "^  build$"; then npm run build; fi
          fi
      # The app's own tests. Nothing ran them unless the builder added a check for them: in the hard-ten test a
      # booking build said its tests were "included" when there were none, and a point-of-sale build's tests failed
      # and were never run. Skipped when another check file of the repository already runs them; the owner switches
      # this step off with the repository variable GHOST_APP_TESTS = off.
      - name: Run the app's own tests
        if: env.GHOST_KIND == 'app' && vars.GHOST_APP_TESTS != 'off'
        run: |
          [ -f package.json ] || { echo "App tests: no package.json."; exit 0; }
          script=$(node -e 'const s=(require("./package.json").scripts||{}).test||""; process.stdout.write(/no test specified/.test(s)?"":s)')
          [ -n "$script" ] || { echo "App tests: package.json has no test script."; exit 0; }
          other=$(grep -lsE '(npm|pnpm|yarn|bun)( run)? test|\b(vitest|jest|playwright test|node --test)\b' .github/workflows/*.yml .github/workflows/*.yaml 2>/dev/null | grep -v '/ghost-' | head -1 || true)
          if [ -n "$other" ]; then echo "App tests: already run by $other."; exit 0; fi
          # Their own copy of the installed database: a test that empties a table must not empty the app the
          # browser opens next.
          if [ -n "$DATABASE_URL" ]; then
            docker exec ghost-db psql -q -U postgres -c "select pg_terminate_backend(pid) from pg_stat_activity where datname = 'app' and pid <> pg_backend_pid()" >/dev/null
            docker exec ghost-db psql -q -U postgres -c "create database ghost_tests template app"
            export DATABASE_URL="postgresql://postgres:ghost@127.0.0.1:5432/ghost_tests" TEST_DATABASE_URL="postgresql://postgres:ghost@127.0.0.1:5432/ghost_tests"
          fi
          run="npm test"; [ -f pnpm-lock.yaml ] && run="pnpm test"; [ -f yarn.lock ] && run="yarn test"
          echo "App tests: $run ($script)"
          set +e
          CI=true timeout 300 $run 2>&1 | tee "$RUNNER_TEMP/app-tests.log"; code=${PIPESTATUS[0]}
          set -e
          off="If they need something this check does not have (a key, another service), the repository's owner can switch this step off: repository variable GHOST_APP_TESTS = off."
          if [ "$code" = 124 ]; then echo "FAIL: the app's own tests did not finish in 5 minutes. \"$run\" must run once and exit (no watch mode). $off"; exit 1; fi
          if [ "$code" != 0 ]; then echo "FAIL: the app's own tests fail (\"$run\", exit $code). Fix the code or the test, whichever is wrong; a test is never deleted or skipped to get green. $off"; exit 1; fi
          if grep -qE '^(#|ℹ) tests 0$|No tests? (files? )?found' "$RUNNER_TEMP/app-tests.log"; then echo "FAIL: \"$run\" ran no tests: the test script finds no test files. Write the tests the task asks for, or fix the script's path."; exit 1; fi
          echo "App tests: passed."
      # Keep the browser and its system packages between checks of this repository: the first check downloads them,
      # later commits reuse them (the download alone took 20 s to over 100 s each time).
      - name: Reuse the browser from earlier checks
        if: env.GHOST_KIND != 'docs'
        id: browser-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/ghost-apt
          key: ghost-browser-${{ runner.os }}-playwright-1.58.2
      - name: Install a real browser
        if: env.GHOST_KIND != 'docs'
        run: |
          mkdir -p "$HOME/.cache/ghost-apt/partial"
          printf 'Dir::Cache::Archives "%s/";\nAPT::Keep-Downloaded-Packages "true";\n' "$HOME/.cache/ghost-apt" | sudo tee /etc/apt/apt.conf.d/99ghost-cache >/dev/null
          mkdir -p "$RUNNER_TEMP/shots" && cd "$RUNNER_TEMP/shots"
          npm init -y >/dev/null && npm install playwright@1.58.2
          npx playwright install --with-deps chromium
          sudo chown -R "$(id -u):$(id -g)" "$HOME/.cache/ghost-apt" || true
          sudo rm -f "$HOME/.cache/ghost-apt/lock" || true
      - name: Keep the browser for the next check
        if: env.GHOST_KIND != 'docs' && steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/ghost-apt
          key: ghost-browser-${{ runner.os }}-playwright-1.58.2
      - name: Photograph the app
        run: |
          if [ "$GHOST_KIND" = docs ]; then
            mkdir -p ghost-screenshots && echo '{"skipped":"nothing to photograph yet: this commit has no web page or app files (no index.html, no package.json, no page or script files)"}' > ghost-screenshots/report.json
            echo "SKIPPED: nothing to photograph yet: this commit has no web page or app files (no index.html, no package.json, no page or script files). This is not a failure: the check passes until there is an app, and photographs it from the first commit that adds one."
            exit 0
          fi
          cat > "$RUNNER_TEMP/shots/shots.mjs" <<'GHOST_SHOTS'
          import http from "node:http";
          import { mkdir, readFile, readdir, writeFile, stat } from "node:fs/promises";
          import path from "node:path";
          import { spawn } from "node:child_process";
          import { chromium } from "playwright";

          const BASE = process.env.GITHUB_WORKSPACE || process.cwd();
          // Pauses after loads and clicks (for animations). The sandbox check shortens them (GHOST_WAIT_SCALE=0.6).
          const WAIT = Math.min(1, Math.max(0.3, Number(process.env.GHOST_WAIT_SCALE) || 1));
          const OUT = path.join(BASE, "ghost-screenshots");
          const TYPES = { ".html": "text/html", ".js": "text/javascript", ".mjs": "text/javascript", ".css": "text/css", ".json": "application/json", ".svg": "image/svg+xml", ".png": "image/png", ".jpg": "image/jpeg", ".jpeg": "image/jpeg", ".gif": "image/gif", ".webp": "image/webp", ".ico": "image/x-icon", ".woff": "font/woff", ".woff2": "font/woff2", ".txt": "text/plain", ".wasm": "application/wasm" };
          await mkdir(OUT, { recursive: true });
          const report = { console: [], page: [], requests: [], overflow: {}, blank: [], views: [], menu: [], clicks: [], serverErrors: [], deadLinks: [], play: [] };
          let phase = ""; // said with an uncaught error: what the check was doing (the play test)
          let serverOut = ""; // the app's own server output (npm start), shown when the check fails
          // A broken page fails the check (an uncaught error, a blank page, no app, a page that won't open), with
          // one FAIL: line each, so the fix loop reads what broke. Console errors, failed requests, sideways
          // scrolling and menu items that won't open are listed as WARN: lines and shown in the pictures' report.
          const finish = async () => {
            for (const k of ["console", "page", "requests", "menu"]) report[k] = [...new Set(report[k])].slice(0, 12);
            await writeFile(path.join(OUT, "report.json"), JSON.stringify(report, null, 2));
            const fails = [];
            if (report.error) fails.push(report.error);
            if (report.login) {
              console.log("LOGIN: " + report.login.result + (report.login.steps.length ? " (" + report.login.steps.join(", ") + ")" : ""));
              if (report.login.result !== "ok" && !/^could not run|^login only/.test(report.login.result)) fails.push("the login doesn't work for a new person: " + report.login.result + ". The check signs up with an email and password, reloads, logs out, tries a wrong password and logs in again" + (report.login.steps.length ? " (it got as far as: " + report.login.steps.join(", ") + ")" : "") + ".");
            }
            for (const p of report.page) fails.push("uncaught error or page that won't open: " + p);
            // The play test (a game): its Start must start the game, and playing must not throw (the errors above).
            for (const p of report.play) {
              console.log("PLAY (" + p.view + "): " + p.started + ", " + p.errors + " error(s) in 10 s of play" + (p.state ? ", window.game " + p.state : ""));
              if (p.started === "did nothing") fails.push("the game's Start button did nothing (" + p.view + "): pressing it (a " + (p.view === "phone" ? "tap" : "click") + ") left the start screen up" + (p.state ? " and window.game unchanged" : "") + ". Start must start play on a click AND a tap (pointer or touch events, not only keys)");
            }
            report.serverErrors = [...new Set(report.serverErrors || [])].slice(0, 6);
            if (report.serverErrors.length) fails.push("the app's own server answered with an error while the first screen loaded (" + report.serverErrors.join(", ") + "): the screen people open shows an error, not the app. Read SERVER OUTPUT below for why. This check gives the app a database when it uses one (DATABASE_URL) and nothing else: anything more the first screen needs (a key, a seeded row, another service) must have a working default, or the screen must work without it");
            for (const b of report.blank) fails.push(b + ": the page is blank (almost no text)");
            for (const c of report.console) console.log("WARN: console error: " + c);
            for (const r of report.requests) console.log("WARN: failed request: " + r);
            for (const m of report.menu) console.log("WARN: " + m);
            if (report.deadLinks.length) fails.push("the app's own menu leads to " + (report.deadLinks.length === 1 ? "a page that doesn't exist" : "pages that don't exist") + " (404): " + report.deadLinks.join(", ") + ". Build the page, or take the item out of the menu");
            // The click test: a button that does nothing is a bug the user would hit at once.
            // Every button counts: one dead button is enough to fail (a task must not end at 7 of 8 and call itself done).
            // A button whose effect can't be seen on the page (copy, download, share, print) is reported, not failed.
            const dead = report.clicks.filter((c) => c.result === "does nothing").map((c) => "'" + c.label + "'");
            if (dead.length) fails.push((dead.length === 1 ? "this button does nothing when pressed: " : "these buttons do nothing when pressed: ") + dead.join(", ") + ". Make each one work (open, switch, add, filter...) or remove it");
            for (const c of report.clicks.filter((c) => c.result === "can't tell")) console.log("WARN: the button '" + c.label + "' changed nothing on the page (it may copy, download, share or print): make sure it does what its label says");
            // A game's canvas that animates by itself hides whether a press changed it: reported, never failed.
            for (const c of report.clicks.filter((c) => c.result === "moves by itself")) console.log("WARN: the button '" + c.label + "' changed nothing outside the game's picture, and the picture moves by itself, so the check can't tell whether it worked: make sure it does what its label says on the first screen");
            // The refresh test: something the user added must still be there in a new browser.
            if (report.refresh?.result === "lost") fails.push("something added in the app ('" + report.refresh.word + "', typed into the first text box) is gone after reopening the app in a new browser" + (report.refresh.server ? " with the server restarted (data kept only in the server's memory is lost: save it in the database)" : "") + ": save what people add (localStorage, IndexedDB or the app's database) and load it on start");
            if (report.refresh) console.log("REFRESH (this device remembers): " + report.refresh.result);
            // The cross-browser test: an app with a server must hold what people add on the server.
            if (report.crossBrowser) console.log("CROSS-BROWSER (the server holds it): " + report.crossBrowser.result);
            if (report.signedOut) console.log("SIGNED OUT (a visitor who never signs in): " + report.signedOut.result);
            if (report.signedOut && report.signedOut.result === "sees it") fails.push("a visitor who never signed in sees what a signed-in person added ('" + report.signedOut.word + "'): people's data must be shown only to them after they sign in (check the session on every request that reads it)");
            if (report.crossBrowser && report.crossBrowser.result === "not seen") fails.push("something added in the app ('" + report.crossBrowser.word + "') survives a refresh but a second, empty browser doesn't see it: it is kept only in the browser that added it. This app has a server: save what people add in its database through the server");
            const worked = report.clicks.filter((c) => c.result === "works" || c.result === "asks for a field first").length;
            if (report.clicks.length) console.log("CLICKS: " + worked + " of " + report.clicks.length + " buttons pressed did something");
            for (const k of Object.keys(report.overflow)) console.log("WARN: " + k + ": the page scrolls sideways by " + report.overflow[k] + "px");
            for (const f of fails) console.log("FAIL: " + f);
            if (report.server) {
              report.server.log = serverOut.split("\n").filter((l) => l.trim()).slice(-25);
              await writeFile(path.join(OUT, "report.json"), JSON.stringify(report, null, 2));
              if (fails.length && report.server.log.length) console.log("SERVER OUTPUT (last lines of npm start):\n" + report.server.log.join("\n"));
            }
            console.log(fails.length ? "The app is broken in the browser (" + fails.length + " problem(s)). Screenshots are in the ghost-screenshots artifact." : "The app opened in the browser with no uncaught errors. Screenshots are in the ghost-screenshots artifact.");
            process.exit(fails.length ? 1 : 0);
          };
          const has = async (file) => { try { await stat(file); return true; } catch { return false; } };

          // An app with its own server (package.json has a "start" script): start it the way it runs online, with
          // PORT set (and DATABASE_URL when the workflow started a database), wait until it really answers, and test
          // that instead of the files. If it never answers, fail with the server's own output, so a slow or crashed
          // start isn't mistaken for a broken page.
          let url = null;
          let serverChild = null;
          const SERVER_PORT = 4300 + Math.floor(Math.random() * 500);
          const SERVER_LIMIT = Number(process.env.SERVER_WAIT_MS) || 90000;
          const startServer = async () => {
            const env = Object.assign({}, process.env, { PORT: String(SERVER_PORT), HOST: "127.0.0.1", HOSTNAME: "127.0.0.1", BROWSER: "none", NODE_ENV: process.env.NODE_ENV || "production" });
            const child = spawn("npm", ["start"], { cwd: BASE, env: env, stdio: ["ignore", "pipe", "pipe"], detached: true });
            serverChild = child;
            const keep = (d) => { serverOut = (serverOut + d.toString()).slice(-8000); };
            child.stdout.on("data", keep);
            child.stderr.on("data", keep);
            child.exited = null;
            child.on("exit", (c) => { child.exited = c === null ? "a signal" : c; });
            const answers = async (u) => { try { const r = await fetch(u, { signal: AbortSignal.timeout(3000) }); return r.status < 500; } catch { return false; } };
            const from = serverOut.length;
            const t0 = Date.now();
            while (child.exited === null && Date.now() - t0 < SERVER_LIMIT) {
              const tries = new Set(["http://127.0.0.1:" + SERVER_PORT + "/"]);
              for (const m of serverOut.slice(Math.max(0, from - 200)).matchAll(/https?:\/\/(?:localhost|127\.0\.0\.1|0\.0\.0\.0|\[::\]):(\d{2,5})/g)) tries.add("http://127.0.0.1:" + m[1] + "/");
              for (const u of tries) { if (await answers(u)) return { url: u, ms: Date.now() - t0, exited: null }; }
              await new Promise((r) => setTimeout(r, 1000));
            }
            return { url: null, ms: Date.now() - t0, exited: child.exited };
          };
          const stopServer = async () => {
            const child = serverChild;
            if (!child || child.exited !== null) return;
            try { process.kill(-child.pid, "SIGTERM"); } catch {}
            for (let i = 0; i < 50 && child.exited === null; i++) await new Promise((r) => setTimeout(r, 100));
            if (child.exited === null) { try { process.kill(-child.pid, "SIGKILL"); } catch {} await new Promise((r) => setTimeout(r, 300)); }
          };
          process.on("exit", () => { if (serverChild) { try { process.kill(-serverChild.pid, "SIGKILL"); } catch {} } });
          const pkg = await readFile(path.join(BASE, "package.json"), "utf8").then((t) => JSON.parse(t)).catch(() => null);

          // Not the app: a native iPhone/Mac or Android app, whose web page (if any) is a separate page. Ai-Alarm-Clock, a Swift
          // iPhone app with a stray index.html, had its real build fail while this check photographed that page and passed. A
          // check named after the app must never pass for something that isn't the app, so that page is not photographed and
          // the check does not pass. The same rule as lib/code/native-app.ts (keep the two in step): native project files at the
          // root or one folder down; not when the native app is built from the web code (Capacitor, Cordova, Ionic, React
          // Native, Expo, Tauri), or when the native project is only in a sub-folder of a web project that builds or serves
          // itself. APP_DIR, set in the workflow, names the web app's folder: then that page is the app.
          const SKIP_DIRS = ["node_modules", ".git", "Pods", "DerivedData", ".build", "build", "dist", "out", ".gradle", "ghost-screenshots"];
          const HYBRID = ["@capacitor/core", "@capacitor/cli", "@capacitor/ios", "@capacitor/android", "cordova", "cordova-ios", "cordova-android", "@ionic/core", "@ionic/react", "@ionic/angular", "@ionic/vue", "react-native", "expo", "@tauri-apps/api", "@tauri-apps/cli"];
          const nativeApp = async () => {
            if (process.env.APP_DIR) return null;
            const apple = [];
            const gradle = [];
            const look = async (dir, rel, depth) => {
              const items = await readdir(dir, { withFileTypes: true }).catch(() => []);
              for (const it of items) {
                const name = rel + it.name;
                if (/\.(xcodeproj|xcworkspace)$/.test(it.name) || (it.isFile() && (it.name === "Package.swift" || it.name === "project.yml"))) apple.push(name);
                else if (it.isFile() && /^(build|settings)\.gradle(\.kts)?$/.test(it.name)) gradle.push(name);
                else if (it.isDirectory() && depth === 0 && !SKIP_DIRS.includes(it.name)) await look(path.join(dir, it.name), name + "/", 1);
              }
            };
            await look(BASE, "", 0);
            // Gradle alone is any Java or Kotlin project (a Spring server too): Android needs its manifest.
            const manifest = async (dir, depth) => {
              if (depth > 4) return false;
              const items = await readdir(dir, { withFileTypes: true }).catch(() => []);
              if (items.some((it) => it.isFile() && it.name === "AndroidManifest.xml")) return true;
              for (const it of items) if (it.isDirectory() && !SKIP_DIRS.includes(it.name) && (await manifest(path.join(dir, it.name), depth + 1))) return true;
              return false;
            };
            const android = gradle.length > 0 && (await manifest(BASE, 0));
            const markers = apple.concat(android ? gradle : []);
            if (!markers.length) return null;
            const deps = Object.assign({}, (pkg && pkg.dependencies) || {}, (pkg && pkg.devDependencies) || {});
            if (HYBRID.some((d) => d in deps)) return null;
            for (const f of ["capacitor.config.json", "capacitor.config.ts", "capacitor.config.js", "capacitor.config.mjs", "capacitor.config.cjs", "ionic.config.json", "config.xml"]) if (await has(path.join(BASE, f))) return null;
            if (!markers.some((m) => !m.includes("/")) && pkg && pkg.scripts && (pkg.scripts.build || pkg.scripts.start)) return null;
            markers.sort((a, b) => a.split("/").length - b.split("/").length || a.localeCompare(b));
            return { platform: apple.length ? "iOS/macOS" : "Android", markers: markers.slice(0, 3) };
          };
          const notTheApp = await nativeApp();
          if (notTheApp) {
            let page = null;
            for (const d of ["dist", "build", "out", ".", "docs", "public"]) {
              if (await has(path.join(BASE, d, "index.html"))) { page = (d === "." ? "" : d + "/") + "index.html"; break; }
            }
            report.notTheApp = { platform: notTheApp.platform, markers: notTheApp.markers, page: page };
            await writeFile(path.join(OUT, "report.json"), JSON.stringify(report, null, 2));
            console.log("NOT THE APP: this repository's app is a native " + notTheApp.platform + " app (" + notTheApp.markers.join(", ") + "). This check opens a web page in a browser" + (page ? ", and the page here (" + page + ") is a separate page, not built from that app" : "") + ": a picture of it would say nothing about the app.");
            console.log("FAIL: not the app. Nothing was photographed, and this check never passes for a native app: the app's own build check (Xcode or Gradle) is the one that counts. Ghost Code no longer adds this check to native apps: delete .github/workflows/ghost-screenshots.yml, or, if that web page really is the app, set APP_DIR to its folder in this workflow.");
            process.exit(1);
          }

          if (pkg && pkg.scripts && pkg.scripts.start && !process.env.GHOST_STATIC) {
            report.server = { command: "npm start", port: SERVER_PORT };
            const s = await startServer();
            url = s.url;
            report.server.ready_ms = s.url ? s.ms : null;
            if (!url && s.exited === 0) {
              // "start" ran something that finished (a build or a script), not a server: test the files instead.
              report.server = null;
              console.log("WARN: npm start finished without serving anything, so the app's files are tested instead");
            } else if (!url) {
              report.error = s.exited !== null
                ? "the app's server (npm start) stopped (exit " + s.exited + ") before it answered; its output is below"
                : "the app's server (npm start) didn't answer within " + Math.round(SERVER_LIMIT / 1000) + " seconds; it must listen on process.env.PORT. Its output is below";
              await finish();
            } else {
              report.served = "npm start (" + url + ")";
              console.log("SERVER: npm start answered at " + url + " after " + (s.ms / 1000).toFixed(1) + "s");
              report.commit = (process.env.GITHUB_SHA || "").slice(0, 7) || null;
              console.log("PHOTOGRAPHED: " + (report.commit ? "commit " + report.commit + ", " : "") + "served by this commit's own npm start");
            }
          }

          // A server in the code (server.js, app.js... calling listen) that nothing starts: the app can't run as it
          // would online, so testing its page files alone would pass a broken app. Fail and say what's missing.
          if (!url && !report.server && !process.env.GHOST_STATIC && !(pkg && pkg.scripts && pkg.scripts.start)) {
            for (const f of ["server.js", "server.mjs", "server.ts", "app.js", "index.js", "src/server.js", "src/server.ts", "src/index.js", "src/app.js"]) {
              const code = await readFile(path.join(BASE, f), "utf8").catch(() => "");
              if (code.includes(".listen(") && (code.includes("express") || code.includes("http") || code.includes("fastify") || code.includes("koa"))) {
                report.error = f + " is a server, but " + (pkg ? "package.json has no 'start' script" : "there is no package.json") + ", so the app can't run. Add a package.json with its dependencies and a 'start' script (e.g. 'node " + f + "') that listens on process.env.PORT.";
                await finish();
              }
            }
          }

          let root = null;
          let server = null;
          if (!url) {
          for (const d of [process.env.APP_DIR, "dist", "build", "out", ".", "docs", "public"]) {
            if (!d) continue;
            const dir = path.resolve(BASE, d);
            if (await has(path.join(dir, "index.html"))) { root = dir; break; }
          }
          // No app here yet (a stage of the task that only writes documents: no package.json and not one web file anywhere):
          // nothing to photograph, and nothing is broken. Said plainly and passed, instead of failing every commit with "no
          // index.html" and sending Ghost Code off to "fix" a check while it writes Markdown (ghost-media-video-crew: 5 red
          // runs in a row on a docs-only stage). From the first commit that adds a page or an app, the check runs in full.
          const WEB_EXT = [".html", ".htm", ".js", ".mjs", ".cjs", ".jsx", ".ts", ".tsx", ".css", ".scss", ".vue", ".svelte", ".astro", ".php", ".py", ".rb", ".go"];
          const webFileIn = async (dir, depth) => {
            const items = await readdir(dir, { withFileTypes: true }).catch(() => []);
            for (const it of items) {
              if (it.isFile() && WEB_EXT.some((e) => it.name.toLowerCase().endsWith(e))) return true;
              if (it.isDirectory() && depth < 4 && !SKIP_DIRS.includes(it.name) && it.name !== ".github" && (await webFileIn(path.join(dir, it.name), depth + 1))) return true;
            }
            return false;
          };
          if (!root && !pkg && !process.env.APP_DIR && !(await webFileIn(BASE, 0))) {
            report.skipped = "nothing to photograph yet: this commit has no web page or app files (no index.html, no package.json, no page or script files)";
            await writeFile(path.join(OUT, "report.json"), JSON.stringify(report, null, 2));
            console.log("SKIPPED: " + report.skipped + ". This is not a failure: the check passes until there is an app, and photographs it from the first commit that adds one.");
            process.exit(0);
          }
          if (!root) {
            report.error = "no index.html found (looked in dist, build, out, the repository root, docs and public)";
            await finish();
          }
          report.served = path.relative(BASE, root) || ".";
          // Which commit this is, and whether the page about to be photographed was built in THIS run. A green screenshot
          // must be of this commit's build: an app with a build step whose built folder holds an older copy (one committed
          // to the repository and not rebuilt) would be photographed and passed while the commit's own code never built.
          // GHOST_BUILD_START: the moment before the build step (seconds), set by the check file.
          report.commit = (process.env.GITHUB_SHA || "").slice(0, 7) || null;
          {
            const started = Number(process.env.GHOST_BUILD_START || 0);
            const builds = Boolean(pkg && pkg.scripts && pkg.scripts.build);
            const builtDir = ["dist", "build", "out"].includes(report.served);
            if (builds && builtDir && started) {
              const at = await stat(path.join(root, "index.html")).then((x) => x.mtimeMs / 1000, () => 0);
              if (at && at < started - 2) {
                report.error = report.served + "/index.html was not made by this commit's build: it is an older copy (the build step ran and did not write it). Photographing it would show old code as if it were this commit" + (report.commit ? " (" + report.commit + ")" : "") + ". Make the build write " + report.served + "/, and don't keep a built copy in the repository";
                await finish();
              }
              report.built = "in this run";
            } else if (builds && !builtDir) report.built = "not checked (the app has a build step, but the page opened is not in dist, build or out)";
            else report.built = builds ? "not checked" : "no build step (the files are the app)";
            console.log("PHOTOGRAPHED: " + (report.commit ? "commit " + report.commit + ", " : "") + "served from " + report.served + ", built: " + report.built);
          }

          // A tiny static server, so the app runs from http:// like it will online (single-page apps fall back to index.html).
          server = http.createServer(async (req, res) => {
            try {
              let p = decodeURIComponent(new URL(req.url, "http://x").pathname);
              if (p.endsWith("/")) p += "index.html";
              let file = path.join(root, p);
              if (!file.startsWith(root)) throw new Error("outside the app folder");
              if (!(await has(file)) && !path.extname(file)) file = path.join(root, "index.html");
              const data = await readFile(file);
              res.writeHead(200, { "content-type": TYPES[path.extname(file).toLowerCase()] || "application/octet-stream" });
              res.end(data);
            } catch {
              res.writeHead(404);
              res.end("not found");
            }
          });
          await new Promise((r) => server.listen(0, "127.0.0.1", r));
          url = "http://127.0.0.1:" + server.address().port + "/";
          }

          // A smaller picture of a screenshot for the chat, drawn in the browser (no image library needed). 720 pixels wide
          // (it was 360, at a lower quality): on a phone's sharp screen the old ones were a blur, and text in them could not
          // be read even when tapped to enlarge. Never made wider than the screenshot itself (a phone-sized one stays as is).
          const thumbOf = async (context, jpg) => {
            const t = await context.newPage();
            await t.setContent("<canvas id='c'></canvas>");
            const b64 = await t.evaluate(async (a) => {
              const img = new Image();
              img.src = "data:image/jpeg;base64," + a.b64;
              await img.decode();
              const c = document.getElementById("c");
              c.width = Math.min(a.w, img.width);
              c.height = Math.round(img.height * (c.width / img.width));
              c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
              return c.toDataURL("image/jpeg", 0.74).split(",")[1];
            }, { b64: jpg.toString("base64"), w: 720 });
            await t.close();
            return Buffer.from(b64, "base64");
          };

          // The login test (apps with accounts): when the first screen asks for a password, the check signs up as a new
          // person, and everything after it (menu, buttons, refresh) runs logged in, like a real user. It also checks
          // that the login survives a reload, that Log out logs out, that a wrong password is refused and that the same
          // email and password log in again.
          const RAND = Math.floor(Math.random() * 900000 + 100000);
          const CREDS = { email: "ghost" + RAND + "@example.com", user: "ghost" + RAND, pass: "Gh0st-" + RAND + "-pw", name: "Ghost Tester" };
          const askingPassword = async (page) => (await page.locator("input[type='password']").filter({ visible: true }).count().catch(() => 0)) > 0;
          // A sign-in screen: a password box, an email box, or a "Sign in" / "Log in" button.
          const signInScreen = async (page) =>
            (await askingPassword(page)) ||
            (await page.locator("input[type='email'], input[autocomplete='email'], input[autocomplete='username']").filter({ visible: true }).count().catch(() => 0)) > 0 ||
            (await page.getByRole("button", { name: /sign ?in|log ?in|sign ?up|create account/i }).filter({ visible: true }).count().catch(() => 0)) > 0;
          const clickText = async (page, re) => {
            for (const role of ["button", "link", "tab"]) {
              const t = page.getByRole(role, { name: re }).filter({ visible: true }).first();
              if (await t.count()) { await t.click({ timeout: 3000 }).catch(() => {}); await page.waitForTimeout(WAIT * 700); return true; }
            }
            const t = page.getByText(re).filter({ visible: true }).first();
            if (await t.count()) { await t.click({ timeout: 3000 }).catch(() => {}); await page.waitForTimeout(WAIT * 700); return true; }
            return false;
          };
          const fillAuth = async (page, pass) => {
            const fields = page.locator("input").filter({ visible: true });
            const n = await fields.count();
            for (let i = 0; i < n; i++) {
              const f = fields.nth(i);
              const d = await f.evaluate((el) => {
                const lab = (el.labels && el.labels[0] ? el.labels[0].innerText : "") + " " + (el.name || "") + " " + (el.id || "") + " " + (el.placeholder || "") + " " + (el.getAttribute("aria-label") || "") + " " + (el.autocomplete || "");
                return { type: (el.type || "text").toLowerCase(), hint: lab.toLowerCase() };
              }).catch(() => null);
              if (!d || ["checkbox", "radio", "hidden", "submit", "button", "file", "range", "color"].includes(d.type)) continue;
              let v = null;
              if (d.type === "password") v = pass;
              else if (d.type === "email" || d.hint.includes("email") || d.hint.includes("e-mail")) v = CREDS.email;
              else if (d.hint.includes("user") || d.hint.includes("login") || d.hint.includes("handle")) v = CREDS.user;
              else if (d.hint.includes("name")) v = CREDS.name;
              else if (d.type === "text" || d.type === "tel") v = d.type === "tel" ? "5550100" : CREDS.name;
              if (v !== null) await f.fill(v, { timeout: 2000 }).catch(() => {});
            }
          };
          const submitAuth = async (page, re) => {
            const pw = page.locator("input[type='password']").filter({ visible: true }).last();
            if (await pw.count()) await pw.press("Enter").catch(() => {});
            await page.waitForTimeout(WAIT * 1500);
            if (await askingPassword(page)) {
              const b = page.getByRole("button", { name: re }).filter({ visible: true }).last();
              if (await b.count()) { await b.click({ timeout: 3000 }).catch(() => {}); await page.waitForTimeout(WAIT * 1500); }
            }
            return !(await askingPassword(page));
          };
          const SIGNUP = /sign ?up|create (an |your )?account|register|join|get started/i;
          const LOGIN = /log ?in|sign ?in|continue|submit/i;
          const logIn = async (page, pass) => {
            if (!(await askingPassword(page))) await clickText(page, /log ?in|sign ?in/i);
            if (!(await askingPassword(page))) return false;
            await fillAuth(page, pass);
            return submitAuth(page, LOGIN);
          };
          const loginTest = async (page) => {
            const r = { result: "", steps: [] };
            // Sign up: open the sign-up form if there is one, fill it in, send it.
            const opened = await clickText(page, SIGNUP);
            const canSignUp = opened || (await page.getByText(SIGNUP).filter({ visible: true }).count()) > 0;
            await fillAuth(page, CREDS.pass);
            let inside = await submitAuth(page, SIGNUP);
            // Some apps go back to the login form after signing up.
            if (!inside) inside = await logIn(page, CREDS.pass);
            // A login with no way to sign up (an admin password): a stranger can't get in, and that is by design.
            if (!inside) { r.result = canSignUp ? "can't get in" : "login only (no sign-up to test)"; return r; }
            r.steps.push("signed up and logged in");
            await page.reload({ waitUntil: "load" }).catch(() => {});
            await page.waitForTimeout(WAIT * 1200);
            if (await askingPassword(page)) { r.result = "logged out by a reload"; return r; }
            r.steps.push("still logged in after a reload");
            // A person confirms "Are you sure?" or "Discard changes?" when they log out.
            const yes = (d) => { d.accept().catch(() => {}); };
            page.on("dialog", yes);
            const out = await clickText(page, /log ?out|sign ?out/i);
            await page.waitForTimeout(WAIT * 500);
            page.off("dialog", yes);
            if (!out) { r.result = "ok"; r.steps.push("no Log out button found"); return r; }
            if (!(await askingPassword(page))) await page.goto(url, { waitUntil: "load" }).catch(() => {});
            if (!(await askingPassword(page))) { r.result = "Log out didn't log out"; return r; }
            r.steps.push("Log out worked");
            if (await logIn(page, CREDS.pass + "-wrong")) { r.result = "a wrong password logged in"; return r; }
            r.steps.push("a wrong password was refused");
            await page.goto(url, { waitUntil: "load" }).catch(() => {});
            await page.waitForTimeout(WAIT * 800);
            if (!(await logIn(page, CREDS.pass))) { r.result = "can't log back in with the same email and password"; return r; }
            r.steps.push("logged back in");
            r.result = "ok";
            return r;
          };

          // The page never finished opening: is the app's own script stuck (an endless loop)? Then pause it and say where, with
          // the code, so it is fixed in one round instead of guessed at (a "could not open the app (Timeout)" took three paid
          // rounds to trace to a MutationObserver that re-ran on its own changes). Null when the page isn't frozen.
          // The debugger is switched on before the page opens (a frozen page can't switch it on any more); pausing still works.
          const within = (p, ms) => Promise.race([p, new Promise((r) => setTimeout(() => r(null), ms))]);
          const watchScripts = async (context, page) => {
            const w = { cdp: null, files: new Map() };
            try {
              w.cdp = await context.newCDPSession(page);
              w.cdp.on("Debugger.scriptParsed", (s) => w.files.set(s.scriptId, { url: s.url, start: s.startLine || 0 }));
              await within(w.cdp.send("Debugger.enable"), 5000);
              await within(w.cdp.send("Debugger.setSkipAllPauses", { skip: true }), 5000); // a "debugger;" line in the app must not stop it
            } catch {
              w.cdp = null;
            }
            return w;
          };
          const stuckAt = async (page, w) => {
            try {
              const frozen = await within(page.evaluate(() => false).catch(() => false), 3000);
              if (frozen === false || !w.cdp) return null;
              const { cdp, files } = w;
              await within(cdp.send("Debugger.setSkipAllPauses", { skip: false }).catch(() => null), 3000);
              const paused = new Promise((r) => cdp.once("Debugger.paused", r));
              await within(cdp.send("Debugger.pause").catch(() => null), 3000);
              const ev = await within(paused, 3000);
              if (!ev || !ev.callFrames.length) return "its own script never finishes (the page is frozen)";
              const where = (f) => {
                let file = (files.get(f.location.scriptId) || {}).url || "";
                try { file = new URL(file).pathname; } catch {}
                if (!file || file === "/") file = "index.html";
                return file.replace(/^\//, "") + " line " + (f.location.lineNumber + 1);
              };
              const top = ev.callFrames[0];
              const source = (await within(cdp.send("Debugger.getScriptSource", { scriptId: top.location.scriptId }).then((s) => (s.scriptSource.split("\n")[top.location.lineNumber - ((files.get(top.location.scriptId) || {}).start || 0)] || "").trim().slice(0, 200)).catch(() => ""), 3000)) || "";
              const chain = ev.callFrames.slice(0, 4).map((f) => (f.functionName || (f === ev.callFrames[ev.callFrames.length - 1] ? "the page's script" : "an unnamed function")) + " (" + where(f) + ")").join(" <- ");
              return "its own script never finishes: an endless loop at " + where(top) + (source ? ": " + source : "") + ". Running: " + chain + ". Often a watcher (MutationObserver, an event or a timer) that changes what it watches and so runs itself again; make it skip its own changes or stop watching while it updates";
            } catch {
              return null;
            }
          };

          // A film, animation or game that starts at 0:00 (a Play button, a canvas, a <video>, a timeline like "0.00 / 15.00")
          // photographed as it loads is a nearly black frame (seen on a 15-second film page). Before the picture: press its
          // Play (or Start) button, seek a <video> or a timeline slider to about 45% of its length, or wait a moment (at most
          // 2.5 s) so the picture shows real content. Only for pages that look like that; buttons, errors and the rest of the
          // check are tested as before (each of those reloads the page first).
          const FILM_SHARE = 0.45;
          const toMidFilm = async (page) => {
            const look = await page.evaluate(() => {
              const vis = (el) => { const r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0; };
              const text = (document.body ? document.body.innerText : "").slice(0, 4000);
              const play = [...document.querySelectorAll("button, [role=button], a")].filter(vis).find((b) => /^\s*(?:▶|►|⏵)?\s*(?:play|start|watch|begin)\b|^\s*[▶►⏵]\s*$/i.test((b.innerText || b.getAttribute("aria-label") || b.title || "").trim()));
              const video = [...document.querySelectorAll("video")].find((v) => vis(v));
              const range = [...document.querySelectorAll("input[type=range]")].find((r) => vis(r));
              const canvas = [...document.querySelectorAll("canvas")].some((c) => vis(c) && c.width * c.height > 20000);
              const anims = typeof document.getAnimations === "function" ? document.getAnimations().length : 0;
              const clock = /(\d+(?:[.:]\d+)?)\s*(?:s\b)?\s*\/\s*(\d+(?:[.:]\d+)?)\s*s?\b/.exec(text);
              const secs = (t) => t.includes(":") ? t.split(":").reduce((a, b) => a * 60 + Number(b), 0) : Number(t);
              const length = clock ? secs(clock[2]) : 0;
              if (play) play.setAttribute("data-ghost-play", "1");
              if (range) range.setAttribute("data-ghost-seek", "1");
              return { play: Boolean(play), video: Boolean(video), range: Boolean(range), canvas, anims, length: length > 0 && length < 3600 ? length : 0 };
            }).catch(() => null);
            if (!look || !(look.play || look.video || look.canvas || look.anims > 0 || look.length)) return null;
            const did = [];
            if (look.play) {
              await page.locator("[data-ghost-play]").first().click({ timeout: 3000 }).then(() => did.push("pressed Play"), () => {});
              await page.waitForTimeout(WAIT * 300);
            }
            // Seek: a <video> to its middle, or the timeline slider (a range input) of a page with a Play button or a clock.
            const seeked = await page.evaluate(([share, timeline]) => {
              const v = [...document.querySelectorAll("video")].find((x) => Number.isFinite(x.duration) && x.duration > 0);
              if (v) { v.currentTime = v.duration * share; return "video"; }
              // A slider is a timeline only next to a Play button or a clock (never a volume or settings slider elsewhere).
              const r = timeline ? document.querySelector("[data-ghost-seek]") : null;
              if (r) {
                const min = Number(r.min || 0), max = Number(r.max || 100);
                const val = String(min + (max - min) * share);
                const set = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value").set;
                set.call(r, val);
                r.dispatchEvent(new Event("input", { bubbles: true }));
                r.dispatchEvent(new Event("change", { bubbles: true }));
                return "timeline";
              }
              return "";
            }, [FILM_SHARE, Boolean(look.play || look.length)]).catch(() => "");
            if (seeked) did.push("moved the " + seeked + " to " + Math.round(FILM_SHARE * 100) + "%");
            // No seek: let it play partway (45% of the stated length, at most 2.5 s of real waiting).
            const waitMs = seeked ? 500 : Math.min(2500, look.length ? look.length * 1000 * FILM_SHARE : 1500);
            await page.waitForTimeout(WAIT * waitMs);
            did.push("waited " + (WAIT * waitMs / 1000).toFixed(1) + " s");
            return did.join(", ");
          };

          // THE PLAY TEST, for a game (a big canvas). Real runs: two shooters passed this check and then threw "Cannot read
          // properties of undefined" the first time a shot hit an enemy, and one game's Start button did nothing; pressing
          // each button once never got that far. So the game is started (its Start button, clicked or tapped) and played
          // for 10 seconds: fire held and moving side to side with the keys on a computer, tapping the canvas on a phone,
          // pressing through "next level" or "play again". An uncaught error while playing fails like any other; a Start
          // that leaves the start screen up fails. window.game, when the game keeps its state there, is read before and after.
          const isGame = (page) => page.evaluate(() => [...document.querySelectorAll("canvas")].some((c) => { const r = c.getBoundingClientRect(); return r.width * r.height > 40000; })).catch(() => false);
          const gameState = (page) => page.evaluate(() => { try { const g = window.game; return g && typeof g === "object" ? JSON.stringify({ screen: g.screen ?? g.state ?? null, level: g.level ?? null, score: g.score ?? null }) : null; } catch (e) { return null; } }).catch(() => null);
          const playGame = async (page, name, mobile) => {
            const errorsBefore = report.page.length;
            await page.goto(url, { waitUntil: "load", timeout: 20000 });
            await page.waitForTimeout(WAIT * 800);
            const before = await gameState(page);
            const start = page.getByRole("button", { name: /^\s*(start|play|new game|begin)/i }).filter({ visible: true }).first();
            let started = "no Start button (pressed Enter and Space)";
            phase = " (while playing the game for 10 s)";
            if (await start.count().catch(() => 0)) {
              if (mobile) await start.tap({ timeout: 3000 }).catch(() => {}); else await start.click({ timeout: 3000 }).catch(() => {});
              await page.waitForTimeout(WAIT * 700);
              const stillThere = await start.isVisible().catch(() => false);
              const after = await gameState(page);
              started = (before !== null ? after === before : stillThere) ? "did nothing" : "started";
            } else {
              await page.keyboard.press("Enter").catch(() => {});
              await page.keyboard.press("Space").catch(() => {});
            }
            const box = await page.locator("canvas").first().boundingBox().catch(() => null);
            const t0 = Date.now();
            if (!mobile) await page.keyboard.down("Space").catch(() => {});
            while (Date.now() - t0 < 10000) {
              if (mobile && box) await page.touchscreen.tap(box.x + box.width * (0.2 + Math.random() * 0.6), box.y + box.height * 0.8).catch(() => {});
              else for (const k of ["ArrowLeft", "ArrowRight"]) { await page.keyboard.down(k).catch(() => {}); await page.waitForTimeout(250); await page.keyboard.up(k).catch(() => {}); }
              const next = page.getByRole("button", { name: /next|continue|level|restart|play again|try again/i }).filter({ visible: true }).first();
              if (await next.count().catch(() => 0)) await next.click({ timeout: 1000 }).catch(() => {});
              await page.waitForTimeout(200);
            }
            if (!mobile) await page.keyboard.up("Space").catch(() => {});
            phase = "";
            return { view: name, started, errors: report.page.length - errorsBefore, state: await gameState(page) };
          };

          const VIEWS = [["desktop", 1280, 800, false], ["tablet", 820, 1100, false], ["phone", 390, 844, true]];
          const browser = await chromium.launch();
          let frozenPage = false; // a frozen page is frozen at every size: one report, no 20-second wait per size
          for (const [name, width, height, mobile] of VIEWS) {
            if (frozenPage) break;
            const context = await browser.newContext({ viewport: { width, height }, deviceScaleFactor: 1, isMobile: mobile, hasTouch: mobile });
            const page = await context.newPage();
            const scripts = name === "desktop" ? await watchScripts(context, page) : { cdp: null, files: new Map() };
            page.on("pageerror", (e) => report.page.push(name + phase + ": " + e.message));
            page.on("console", (m) => { if (m.type() === "error" && !/favicon/i.test(m.text())) report.console.push(name + ": " + m.text().slice(0, 300)); });
            // While the first screen loads: an error from the app's OWN server (5xx) means the screen people open is an error
            // message, not the app. That fails the check (a kanban build was green on "Could not load board": every picture
            // was that message, and the 503 behind it was only a warning). Other hosts and 4xx stay warnings.
            let firstScreen = true;
            page.on("response", (r) => {
              if (r.status() >= 400 && !/favicon/i.test(r.url())) report.requests.push(name + ": " + r.status() + " " + r.url().replace(url, "/"));
              if (firstScreen && r.status() >= 500 && r.url().startsWith(new URL(url).origin)) report.serverErrors.push(r.status() + " " + new URL(r.url()).pathname);
            });
            try {
              await page.goto(url, { waitUntil: "load", timeout: 20000 });
              await page.waitForTimeout(WAIT * 1500);
              // Blank: almost no text AND nothing drawn. A film or a picture page shows a few words over shapes (a 15-second
              // film made of 30 coloured shapes and one caption was failed as "blank"): visible pictures (img, svg, video) or
              // at least 3 visible painted boxes count as something to see. A canvas alone doesn't (a game that never drew
              // still has its canvas). Text and boxes count only where they can be seen: inside the page and inside every
              // ancestor that clips (overflow other than visible). A real run's film page was 960 px wide in a body of
              // "overflow: hidden": on a phone the whole film sat below the body's edge, the screenshot was one flat colour,
              // and the check passed because the words were still in the page's text.
              const measure = () => page.evaluate(() => {
                const clipOf = (el) => {
                  let box = { l: 0, t: 0, r: Math.max(document.documentElement.scrollWidth, window.innerWidth), b: Math.max(document.documentElement.scrollHeight, window.innerHeight) };
                  for (let a = el; a && a !== document.documentElement; a = a.parentElement) {
                    const s = getComputedStyle(a);
                    if (s.overflowX !== "visible" || s.overflowY !== "visible") {
                      const r = a.getBoundingClientRect();
                      box = { l: Math.max(box.l, r.left), t: Math.max(box.t, r.top), r: Math.min(box.r, r.right), b: Math.min(box.b, r.bottom) };
                    }
                  }
                  return box;
                };
                const inside = (r, el, min) => { const c = clipOf(el); return Math.min(r.right, c.r) - Math.max(r.left, c.l) >= min && Math.min(r.bottom, c.b) - Math.max(r.top, c.t) >= min; };
                const shown = (el) => { const s = getComputedStyle(el); return s.visibility !== "hidden" && Number(s.opacity) !== 0; };
                let drawn = 0;
                for (const el of document.querySelectorAll("body *")) {
                  if (drawn >= 3) break;
                  if (!inside(el.getBoundingClientRect(), el, 8) || !shown(el)) continue;
                  const s = getComputedStyle(el);
                  if (/^(IMG|SVG|VIDEO)$/i.test(el.tagName)) drawn = 3;
                  else if (el.tagName === "CANVAS") {
                    // A canvas counts when it shows a picture (3+ colours, sampled small), not for being there: a film drawn
                    // on a canvas with its words on it was failed as "blank" (a real run), and a game that never drew still is.
                    try {
                      const small = document.createElement("canvas");
                      small.width = small.height = 24;
                      const g = small.getContext("2d");
                      g.drawImage(el, 0, 0, 24, 24);
                      const d = g.getImageData(0, 0, 24, 24).data;
                      const colours = new Set();
                      for (let i = 0; i < d.length; i += 4) colours.add(((d[i] >> 4) << 8) | ((d[i + 1] >> 4) << 4) | (d[i + 2] >> 4));
                      if (colours.size >= 3) drawn = 3;
                    } catch (e) {
                      // a canvas the page can't read back: it decides nothing
                    }
                  }
                  else if ((s.backgroundColor !== "rgba(0, 0, 0, 0)" && s.backgroundColor !== "transparent") || s.backgroundImage !== "none") drawn++;
                }
                let text = 0;
                if (document.body) {
                  const walk = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
                  for (let n = walk.nextNode(); n && text < 20; n = walk.nextNode()) {
                    const t = (n.textContent || "").trim();
                    if (!t || !n.parentElement || !shown(n.parentElement)) continue;
                    const range = document.createRange();
                    range.selectNodeContents(n);
                    if (inside(range.getBoundingClientRect(), n.parentElement, 1)) text += t.length;
                  }
                }
                return { h: document.documentElement.scrollHeight, over: document.documentElement.scrollWidth - window.innerWidth, text, drawn };
              });
              const info = await measure();
              if (info.over > 2) report.overflow[name] = info.over;
              if (info.text < 20 && info.drawn < 3) report.blank.push(name);
              await page.setViewportSize({ width, height: Math.min(Math.max(info.h, 600), 1800) });
              await page.waitForTimeout(WAIT * 400);
              // A film or animation: photographed partway through, not at its black first frame.
              const film = await toMidFilm(page).catch(() => null);
              if (film) {
                report.film = report.film || {};
                report.film[name] = film;
                if (name === "desktop") console.log("FILM: the page animates, so the picture is taken partway through (" + film + ")");
              }
              const jpg = await page.screenshot({ type: "jpeg", quality: 60 });
              // The picture itself decides too, when almost no words can be seen at the moment it is taken: a screen where under
              // 0.2% of it differs from its main colour shows nothing, whatever boxes the page has. (Not on a page with words in
              // view: one short line on a tall white phone screen is under 0.2% too, and it is not blank.) A real film's 960 px stage sat outside a phone's "overflow: hidden"
              // body: its words and boxes were "there", the phone picture was one flat dark colour, and the check passed.
              if (!report.blank.includes(name) && (await measure().catch(() => ({ text: 99 }))).text < 20) {
                const share = await page.evaluate(async (b64) => {
                  const img = new Image();
                  img.src = "data:image/jpeg;base64," + b64;
                  await img.decode();
                  const c = document.createElement("canvas");
                  c.width = 200;
                  c.height = Math.max(1, Math.round((200 * img.height) / img.width));
                  const g = c.getContext("2d");
                  g.drawImage(img, 0, 0, c.width, c.height);
                  const d = g.getImageData(0, 0, c.width, c.height).data;
                  const count = new Map();
                  for (let i = 0; i < d.length; i += 4) { const k = ((d[i] >> 3) << 10) | ((d[i + 1] >> 3) << 5) | (d[i + 2] >> 3); count.set(k, (count.get(k) || 0) + 1); }
                  return 1 - Math.max(...count.values()) / (d.length / 4);
                }, jpg.toString("base64")).catch(() => null);
                if (share !== null && share < 0.002) report.blank.push(name);
              }
              await writeFile(path.join(OUT, name + ".jpg"), jpg);
              await writeFile(path.join(OUT, name + ".thumb.jpg"), await thumbOf(context, jpg));
              firstScreen = false;

              // An app that asks for a password: sign up and test the login first; the rest runs logged in.
              if (name === "desktop" && (await askingPassword(page))) {
                try {
                  report.login = await loginTest(page);
                } catch (e) {
                  report.login = { result: "could not run (" + String(e.message).split("\n")[0] + ")", steps: [] };
                }
              }

              // The play test on a phone (taps): after its pictures, so they show the first screen.
              if (name === "phone" && (await isGame(page))) report.play.push(await playGame(page, name, mobile).catch((e) => { phase = ""; return { view: name, started: "could not run (" + String(e.message).split("\n")[0] + ")", errors: 0, state: null }; }));
              // The other screens: up to three items of the menu (sidebar, nav bar or tabs), opened one at a time on desktop.
              // A menu item that opens nothing, or a page that errors, shows up in the pictures and in the report.
              if (name === "desktop") {
                const labels = await page.evaluate(() => {
                  const out = [];
                  const seen = new Set();
                  for (const el of document.querySelectorAll("nav a, nav button, aside a, aside button, [role='tab'], [role='tablist'] button")) {
                    const r = el.getBoundingClientRect();
                    const t = (el.innerText || el.getAttribute("aria-label") || "").trim().split("\n")[0].trim();
                    if (!t || t.length > 24 || r.width < 20 || r.height < 14 || seen.has(t)) continue;
                    if (el.tagName === "A" && (el.target === "_blank" || (el.origin && el.origin !== location.origin))) continue;
                    if (/log ?out|sign ?out|delete|remove|reset|disconnect|disable/i.test(t)) continue;
                    seen.add(t);
                    out.push(t);
                  }
                  return out.slice(1, 9);
                });
                report.views = [];
                // Every item is opened (up to eight); the first three are photographed. An item that leads to a page the
                // app's own server answers 404 for is a dead link, and fails the check: a point-of-sale build was green with
                // "Reports" in its menu and no such page (it was the menu's fifth item, and only three were ever opened).
                const origin = new URL(url).origin;
                for (let k = 0; k < labels.length; k++) {
                  const gone = new Set();
                  const note404 = (r) => { if (r.status() === 404 && r.url().startsWith(origin)) gone.add(new URL(r.url()).pathname.replace(/\/$/, "")); };
                  page.on("response", note404);
                  try {
                    await page.setViewportSize({ width, height });
                    await page.goto(url, { waitUntil: "load", timeout: 20000 });
                    await page.waitForTimeout(WAIT * 800);
                    const before = await page.evaluate(() => location.href + "|" + (document.querySelector("main") || document.body).innerText);
                    await page.getByText(labels[k], { exact: true }).first().click({ timeout: 4000 });
                    await page.waitForTimeout(WAIT * 900);
                    const after = await page.evaluate(() => location.href + "|" + (document.querySelector("main") || document.body).innerText);
                    const at = new URL(page.url()).pathname.replace(/\/$/, "");
                    if (at !== new URL(url).pathname.replace(/\/$/, "") && gone.has(at)) report.deadLinks.push("'" + labels[k] + "' → " + (at || "/"));
                    else if (after === before) report.menu.push("desktop: the menu item '" + labels[k] + "' opens nothing (the screen didn't change)");
                    if (k >= 3) continue;
                    const h = await page.evaluate(() => document.documentElement.scrollHeight);
                    await page.setViewportSize({ width, height: Math.min(Math.max(h, 600), 1400) });
                    await page.waitForTimeout(WAIT * 300);
                    const v = await page.screenshot({ type: "jpeg", quality: 60 });
                    const vname = "view-" + (k + 1);
                    await writeFile(path.join(OUT, vname + ".jpg"), v);
                    await writeFile(path.join(OUT, vname + ".thumb.jpg"), await thumbOf(context, v));
                    report.views.push({ name: vname, label: labels[k] });
                  } catch (e) {
                    report.menu.push("desktop: the menu item '" + labels[k] + "' could not be opened (" + String(e.message).split("\n")[0] + ")");
                  } finally {
                    page.off("response", note404);
                  }
                }

                // The click test: press up to 8 visible buttons of the first screen, one at a time from a fresh
                // page, and see whether each did something (the page changed, a dialog opened, the address changed).
                // A press that throws shows up as an uncaught error; one that changes nothing is listed.
                try {
                  await page.setViewportSize({ width, height });
                  await page.goto(url, { waitUntil: "load", timeout: 20000 });
                  await page.waitForTimeout(WAIT * 800);
                  const found = await page.evaluate(() => {
                    const out = [];
                    const asking = [];
                    const seen = new Set();
                    for (const el of document.querySelectorAll("button, [role='button'], input[type='button'], input[type='submit']")) {
                      if (el.closest("nav, aside") || el.disabled) continue;
                      // A tab or filter that is already the one selected ("All" on a list that shows all): pressing it
                      // rightly changes nothing, so it isn't tested.
                      const cls = (typeof el.className === "string" ? el.className : "").toLowerCase();
                      if (el.getAttribute("aria-pressed") === "true" || el.getAttribute("aria-selected") === "true" || el.getAttribute("aria-current") || el.getAttribute("data-state") === "active" || el.getAttribute("data-state") === "on" || /(^|[^a-z])(active|selected|is-active|current)([^a-z]|$)/.test(cls)) continue;
                      // A drag handle is used by dragging, not by pressing: pressed, it rightly changes nothing (a kanban build
                      // was failed for three "buttons that do nothing" that were its cards' handles).
                      const how = (el.getAttribute("aria-roledescription") || "").toLowerCase();
                      const said = (el.getAttribute("aria-label") || el.title || "").toLowerCase();
                      if (el.draggable || /sortable|draggable/.test(how) || /^drag\b|drag handle|drag to |reorder handle/.test(said) || /(^|[^a-z])(grip|gripper|drag-?handle|dragger|sortable-handle)([^a-z]|$)/.test(cls) || /grab|^move$/.test(getComputedStyle(el).cursor)) continue;
                      const r = el.getBoundingClientRect();
                      if (r.width < 12 || r.height < 12 || r.bottom < 0 || r.top > window.innerHeight * 1.5) continue;
                      const t = (el.innerText || el.value || el.getAttribute("aria-label") || el.title || "").trim().split("\n")[0].trim();
                      if (!t || t.length > 30 || seen.has(t)) continue;
                      if (/log ?out|sign ?out|delete|remove|reset|clear all|disconnect|disable/i.test(t)) continue;
                      seen.add(t);
                      out.push(t);
                      // A form's send button while a required box is empty: the browser itself answers ("Please fill out
                      // this field") in a bubble that is not part of the page, so nothing on the page changes. That is the
                      // form asking for input, not a dead button (an expenses build was failed for its "Create group").
                      const form = el.form || el.closest("form");
                      if (form && el.type === "submit" && !form.noValidate && !el.formNoValidate && !form.checkValidity()) asking.push(t);
                    }
                    return { list: out.slice(0, 8), asking: asking };
                  });
                  const buttons = found.list;
                  for (const label of buttons) {
                    try {
                      await page.goto(url, { waitUntil: "load", timeout: 20000 });
                      await page.waitForTimeout(WAIT * 500);
                      // What a person would see change: the visible text (a number moves, a panel opens), how many
                      // things are visible (a menu or dialog appears), the address, or which option is picked (a category
                      // or tab that becomes the selected one only moves a highlight and a tick). A style that only flickers doesn't count.
                      const SIG = () => {
                        let shown = 0;
                        let picked = "";
                        let i = 0;
                        for (const el of document.body.querySelectorAll("*")) {
                          i++;
                          const r = el.getBoundingClientRect();
                          if (r.width > 1 && r.height > 1 && getComputedStyle(el).visibility !== "hidden" && Number(getComputedStyle(el).opacity) > 0.05) shown++;
                          const cls = (typeof el.className === "string" ? el.className : "").toLowerCase();
                          const on = ["aria-pressed", "aria-selected", "aria-checked", "aria-expanded", "aria-current", "data-state"].map((a) => el.getAttribute(a) || "").join(",");
                          const chosen = /(^|[^a-z])(active|selected|is-active|current|checked|on)([^a-z]|$)/.test(cls) || el.checked === true;
                          if (chosen || on.replace(/,/g, "")) picked += i + ":" + on + (chosen ? "+" : "") + ";";
                        }
                        return location.href + "|" + shown + "|" + picked + "|" + document.body.innerText;
                      };
                      const sig = () => page.evaluate(SIG);
                      // A game draws on a canvas: a press that turns the snake or starts the level changes only pixels,
                      // which the page's text never shows (a snake game's working arrows were called dead). So the canvas
                      // area is photographed too: before, after a wait with no press, and after the press. A canvas that
                      // stays still until pressed and then changes did something; one that moves by itself (an animated
                      // game) can't prove the press either way, so that is reported, not failed.
                      const drawn = () => page.evaluate(() => {
                        let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
                        for (const c of document.querySelectorAll("canvas")) {
                          const r = c.getBoundingClientRect();
                          if (r.width < 12 || r.height < 12 || getComputedStyle(c).visibility === "hidden") continue;
                          x0 = Math.min(x0, Math.max(0, r.left)); y0 = Math.min(y0, Math.max(0, r.top));
                          x1 = Math.max(x1, Math.min(window.innerWidth, r.right)); y1 = Math.max(y1, Math.min(window.innerHeight, r.bottom));
                        }
                        return x1 - x0 >= 12 && y1 - y0 >= 12 ? { x: Math.floor(x0), y: Math.floor(y0), width: Math.floor(x1 - x0), height: Math.floor(y1 - y0) } : null;
                      }).catch(() => null);
                      const area = await drawn();
                      const pic = async () => area ? (await page.screenshot({ clip: area, type: "png" }).catch(() => null)) : null;
                      const same = (a, b) => Boolean(a && b && a.equals(b));
                      let still = false;
                      let before0 = null;
                      if (area) {
                        const p0 = await pic();
                        await page.waitForTimeout(WAIT * 700);
                        before0 = await pic();
                        still = same(p0, before0);
                      }
                      const before = await sig();
                      let dialog = false;
                      page.once("dialog", (d) => { dialog = true; d.dismiss().catch(() => {}); });
                      // A download or a new tab is something happening too.
                      page.once("download", () => { dialog = true; });
                      page.context().once("page", () => { dialog = true; });
                      const target = page.getByRole("button", { name: label, exact: true }).first();
                      if (await target.count()) await target.click({ timeout: 3000 });
                      else await page.getByText(label, { exact: true }).first().click({ timeout: 3000 });
                      await page.waitForTimeout(WAIT * 700);
                      const after = await sig().catch(() => "navigated");
                      const unseen = /copy|download|share|print|export|save as|install/i.test(label);
                      const afterPic = area && after === before ? await pic() : null;
                      const redrawn = Boolean(area && still && afterPic && !same(before0, afterPic));
                      const moving = Boolean(area && !still);
                      let verdict = dialog || after !== before || redrawn ? "works" : found.asking.includes(label) ? "asks for a field first" : unseen ? "can't tell" : moving ? "moves by itself" : "does nothing";
                      // A button that answers only a finger (touchstart: a game's on-screen pad) seems dead to a mouse click.
                      // Before it is called dead, the page is opened once more as a touch screen and the button tapped: a tap
                      // that changes the page (or a still game picture) counts. Errors on that page aren't counted, so this can
                      // only clear a button, never fail one.
                      if (verdict === "does nothing") {
                        const tc = await browser.newContext({ viewport: { width, height }, hasTouch: true, serviceWorkers: "block" }).catch(() => null);
                        if (tc) {
                          try {
                            const tp = await tc.newPage();
                            await tp.goto(url, { waitUntil: "load", timeout: 20000 });
                            await tp.waitForTimeout(WAIT * 500);
                            const tpic = async () => area ? (await tp.screenshot({ clip: area, type: "png" }).catch(() => null)) : null;
                            const t0 = await tpic();
                            const tBefore = await tp.evaluate(SIG);
                            const tt = tp.getByRole("button", { name: label, exact: true }).first();
                            if (await tt.count()) await tt.tap({ timeout: 3000 });
                            else await tp.getByText(label, { exact: true }).first().tap({ timeout: 3000 });
                            await tp.waitForTimeout(WAIT * 700);
                            const tAfter = await tp.evaluate(SIG).catch(() => "navigated");
                            const t1 = tAfter === tBefore ? await tpic() : null;
                            if (tAfter !== tBefore || (area && still && !same(t0, t1) && t0 && t1)) verdict = "works";
                          } catch (e) {
                            // a tap that couldn't be made leaves the mouse click's verdict
                          } finally {
                            await tc.close().catch(() => {});
                          }
                        }
                      }
                      report.clicks.push({ label, result: verdict });
                    } catch (e) {
                      report.clicks.push({ label, result: "could not be pressed" });
                    }
                  }
                } catch (e) {
                  report.menu.push("desktop: the click test could not run (" + String(e.message).split("\n")[0] + ")");
                }

                // The play test (above) on a computer (keys); the phone's is before the menu.
                if (await isGame(page)) report.play.push(await playGame(page, name, mobile).catch((e) => { phase = ""; return { view: name, started: "could not run (" + String(e.message).split("\n")[0] + ")", errors: 0, state: null }; }));
                // The refresh test: type a unique word into the first text box, add it, and see whether it shows on the
                // page. If it does, open the app again in a NEW browser (no memory, no service worker), carrying over only
                // what the app saved (cookies, localStorage, IndexedDB), and check the word is still there.
                try {
                  const MARK = "ghostcheck" + Math.floor(Math.random() * 90000 + 10000);
                  await page.goto(url, { waitUntil: "load", timeout: 20000 });
                  await page.waitForTimeout(WAIT * 600);
                  // The first box that adds something: search, filter and find boxes are skipped (what is typed there
                  // isn't saved data, so it rightly disappears after a refresh).
                  const boxes = page.locator("input:not([type]), input[type='text'], textarea").filter({ visible: true });
                  let box = boxes.first();
                  let found = false;
                  const findBox = async () => {
                    for (let b = 0; b < Math.min(await boxes.count(), 8); b++) {
                      const isSearch = await boxes.nth(b).evaluate((el) => {
                        const hint = ((el.placeholder || "") + " " + (el.getAttribute("aria-label") || "") + " " + (el.name || "") + " " + (el.id || "")).toLowerCase();
                        // A sign-in box (email, user name) isn't somewhere to add things: typing there signs in as that name.
                        const signIn = el.type === "email" || /^(email|username)$/.test(el.getAttribute("autocomplete") || "") || /e-?mail|user ?name|log ?in|sign ?in|password/.test(hint);
                        return signIn || Boolean(el.closest("[role='search'], .search, .searchbox, .search-bar, .filters")) || /search|find|filter|look ?up/.test(hint);
                      }).catch(() => false);
                      if (!isSearch) { box = boxes.nth(b); found = true; return; }
                    }
                  };
                  await findBox();
                  // No box on the screen: the app may open its form with a button ("New note", "Add", "+"), often in a dialog.
                  // A real notes app with sign-in kept its editor behind "New note", so the add, refresh and second-browser
                  // tests never ran and the check passed with its privacy untested.
                  if (!found) {
                    // "New note", "+ New note", "Add", "+" ("+" is not a word character, so it is matched on its own).
                    const opener = page.getByRole("button", { name: /^\s*(\+\s*)?((new|add|create|write|compose)\b|$)/i }).filter({ visible: true }).first();
                    if (await opener.count().catch(() => 0)) {
                      await opener.click({ timeout: 3000 }).catch(() => {});
                      await page.waitForTimeout(WAIT * 500);
                      await findBox();
                    }
                  }
                  if (!found) report.refresh = { result: "no text box to add something with" };
                  else {
                    const shows = async (p) => ((await p.evaluate(() => document.body.innerText).catch(() => "")).includes(MARK));
                    await box.fill(MARK, { timeout: 3000 });
                    await box.press("Enter").catch(() => {});
                    await page.waitForTimeout(WAIT * 600);
                    if (!(await shows(page))) {
                      const add = page.getByRole("button", { name: /add|save|create|submit|post|send|plus|[+]/i }).filter({ visible: true }).first();
                      if (await add.count()) { await add.click({ timeout: 3000 }).catch(() => {}); await page.waitForTimeout(WAIT * 600); }
                    }
                    if (!(await shows(page))) report.refresh = { result: "nothing typed showed up on the page" };
                    else {
                      await page.waitForTimeout(WAIT * 500);
                      const saved = await context.storageState({ indexedDB: true });
                      // An app with a server: restart it too, so data kept only in the server's memory doesn't count.
                      let restarted = "";
                      if (report.server && serverChild) {
                        await stopServer();
                        const again = await startServer();
                        if (!again.url) { report.refresh = { result: "could not run (the server did not start again)" }; throw new Error("server restart"); }
                        url = again.url;
                        restarted = " (server restarted)";
                      }
                      const fresh = await browser.newContext({ viewport: { width, height }, storageState: saved, serviceWorkers: "block" });
                      const again = await fresh.newPage();
                      await again.goto(url, { waitUntil: "load", timeout: 20000 });
                      await again.waitForTimeout(WAIT * 1200);
                      // Signed out by the restart (sessions kept in the server's memory): sign in again as the same test
                      // person before looking. A real notes app's saved note was reported "lost" because the reopened app
                      // showed its sign-in screen, not the notes.
                      let relogged = false;
                      if (!(await shows(again)) && report.login?.result === "ok" && (await signInScreen(again))) {
                        relogged = await logIn(again, CREDS.pass).catch(() => false);
                        await again.waitForTimeout(WAIT * 1200);
                      }
                      report.refresh = { result: (await shows(again)) ? "kept" : "lost", word: MARK, server: Boolean(restarted), ...(relogged ? { signedInAgain: true } : {}) };
                      await fresh.close();
                      // The cross-browser test (apps with a server only; a separate result from the refresh test): is
                      // what was added held by the server, or only by that browser? Open the app in a second, empty
                      // browser (nothing carried over) and look for it there.
                      if (restarted && report.refresh.result === "kept") {
                        const other = await browser.newContext({ viewport: { width, height }, serviceWorkers: "block" });
                        const op = await other.newPage();
                        await op.goto(url, { waitUntil: "load", timeout: 20000 });
                        await op.waitForTimeout(WAIT * 1200);
                        // An app with accounts: the same person logs in on the other browser (their data is private).
                        if (report.login && report.login.result === "ok" && (await askingPassword(op))) { await logIn(op, CREDS.pass); await op.waitForTimeout(WAIT * 800); }
                        const seen = await shows(op);
                        report.crossBrowser = { result: seen ? "seen" : (await signInScreen(op)) ? "private (the other browser is signed out)" : "not seen", word: MARK };
                        await other.close();
                        // An app with accounts: a visitor who never signs in must not see what a signed-in person added.
                        // (The test above signs the same person in on the other browser, so a leak to everyone was never
                        // looked for.)
                        if (report.login && report.login.result === "ok") {
                          const anon = await browser.newContext({ viewport: { width, height }, serviceWorkers: "block" });
                          const ap = await anon.newPage();
                          await ap.goto(url, { waitUntil: "load", timeout: 20000 });
                          await ap.waitForTimeout(WAIT * 1200);
                          report.signedOut = { result: (await shows(ap)) ? "sees it" : "private", word: MARK };
                          await anon.close();
                        }
                      }
                    }
                  }
                } catch (e) {
                  if (!report.refresh || !/could not run/.test(report.refresh.result)) report.refresh = { result: "could not run (" + String(e.message).split("\n")[0] + ")" };
                }
              }
            } catch (e) {
              const stuck = /Timeout/i.test(String(e.message)) ? await stuckAt(page, scripts) : null;
              if (stuck) frozenPage = true;
              report.page.push(name + ": could not open the app (" + (stuck ?? String(e.message).split("\n")[0]) + ")");
            }
            if (scripts.cdp) await within(scripts.cdp.send("Debugger.disable").catch(() => null), 2000);
            await within(context.close().catch(() => null), 10000); // a frozen page can hold up closing
          }
          await within(browser.close().catch(() => null), 10000);
          if (server) server.close();
          await finish();

          GHOST_SHOTS
          cd "$RUNNER_TEMP/shots" && node shots.mjs
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghost-screenshots
          path: ghost-screenshots/
          retention-days: 3
          if-no-files-found: ignore
